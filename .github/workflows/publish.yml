name: Build & Publish AutoDuty-bld

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. 0.0.0.34801)'
        required: true

jobs:
  Build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DALAMUD_HOME: /tmp/dalamud
    steps:
      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.tag }}" >> $GITHUB_ENV
          else
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          
      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud Latest
        run: |
          wget https://goatcorp.github.io/dalamud-distrib/latest.zip -O ${{ env.DALAMUD_HOME }}.zip
          unzip ${{ env.DALAMUD_HOME }}.zip -d ${{ env.DALAMUD_HOME }}

      - name: Restore Project
        run: dotnet restore

      - name: Build Project
        run: dotnet build --configuration Release AutoDuty/AutoDuty.csproj -p:AssemblyVersion=${{ env.VERSION }}

      - name: Rename zip to AutoDuty-bld.zip
        run: mv AutoDuty/bin/Release/AutoDuty-bld/latest.zip AutoDuty/bin/Release/AutoDuty-bld/AutoDuty-bld.zip

      - name: 'Upload to GitHub release'
        run: |
            TAG="${{ env.VERSION }}"
            gh release upload "$TAG" AutoDuty/bin/Release/AutoDuty-bld/AutoDuty-bld.zip --clobber --repo "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash

